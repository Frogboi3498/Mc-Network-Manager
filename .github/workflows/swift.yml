name: Cross-Platform Build Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 1. COMPILE NATIVE MACOS DISTRIBUTION PACKAGES
    - name: Build macOS Application
      run: |
        xcodebuild clean build -project MCNetworkManager.xcodeproj -scheme "MCNetworkManager" -destination 'platform=macOS' -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO
        BUILD_DIR=$(xcodebuild -project MCNetworkManager.xcodeproj -scheme "MCNetworkManager" -showBuildSettings | grep -m 1 "BUILT_PRODUCTS_DIR" | awk '{print $3}')
        mkdir -p ./dist_macos
        hdiutil create -volname "MCNetworkManager-Mac" -srcfolder "$BUILD_DIR/" -ov -format UDZO ./dist_macos/MCNetworkManager-Mac.dmg

    # 2. COMPILE IPHONE ARCHITECTURE PAYLOAD
    - name: Build iPhone Simulator Framework
      run: |
        xcodebuild clean build -project MCNetworkManager.xcodeproj -scheme "MCNetworkManager" -destination 'platform=iOS Simulator,name=iPhone 16' -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO
        BUILD_DIR=$(xcodebuild -project MCNetworkManager.xcodeproj -scheme "MCNetworkManager" -destination 'platform=iOS Simulator,name=iPhone 16' -showBuildSettings | grep -m 1 "BUILT_PRODUCTS_DIR" | awk '{print $3}')
        mkdir -p ./dist_iphone
        cp -R "$BUILD_DIR/" ./dist_iphone/

    # 3. COMPILE IPAD ARCHITECTURE PAYLOAD
    - name: Build iPad Simulator Framework
      run: |
        xcodebuild clean build -project MCNetworkManager.xcodeproj -scheme "MCNetworkManager" -destination 'platform=iOS Simulator,name=iPad (10th generation)' -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO
        BUILD_DIR=$(xcodebuild -project MCNetworkManager.xcodeproj -scheme "MCNetworkManager" -destination 'platform=iOS Simulator,name=iPad (10th generation)' -showBuildSettings | grep -m 1 "BUILT_PRODUCTS_DIR" | awk '{print $3}')
        mkdir -p ./dist_ipad
        cp -R "$BUILD_DIR/" ./dist_ipad/

    # 4. DISPATCH INDEPENDENT DOWNLOADABLE FILES
    - name: Upload Mac DMG
      uses: actions/upload-artifact@v4
      with:
        name: MCNetworkManager-Mac-Installer
        path: ./dist_macos/

    - name: Upload iPhone Framework
      uses: actions/upload-artifact@v4
      with:
        name: MCNetworkManager-iPhone-Framework
        path: ./dist_iphone/

    - name: Upload iPad Framework
      uses: actions/upload-artifact@v4
      with:
        name: MCNetworkManager-iPad-Framework
        path: ./dist_ipad/
