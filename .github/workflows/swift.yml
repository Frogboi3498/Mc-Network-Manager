name: Build Cross-Platform Apps

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Build macOS Application
      run: |
        xcodebuild clean build -project MCNetworkManager.xcodeproj -scheme "MCNetworkManager" -destination 'platform=macOS' -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO
        BUILD_DIR=$(xcodebuild -project MCNetworkManager.xcodeproj -scheme "MCNetworkManager" -showBuildSettings | grep -m 1 "BUILT_PRODUCTS_DIR" | awk '{print $3}')
        mkdir -p ./dist_macos
        hdiutil create -volname "MCNetworkManager-Mac" -srcfolder "$BUILD_DIR/" -ov -format UDZO ./dist_macos/MCNetworkManager-Mac.dmg

    - name: Upload Mac DMG
      uses: actions/upload-artifact@v4
      with:
        name: MCNetworkManager-Mac-Installer
        path: ./dist_macos/

  build-mobile:
    name: Build iOS Mobile Targets
    runs-on: macos-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Compile iPhone 17 App Payload
      # Added SWIFT_ACTIVE_COMPILATION_CONDITIONS to bypass Mac-only pasteboard modules
      run: |
        xcodebuild clean build -project MCNetworkManager.xcodeproj -scheme "MCNetworkManager" -destination 'platform=iOS Simulator,name=iPhone 17' SUPPORTED_PLATFORMS="iphonesimulator iphoneos" SWIFT_ACTIVE_COMPILATION_CONDITIONS="iOS" -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO
        BUILD_DIR=$(xcodebuild -project MCNetworkManager.xcodeproj -scheme "MCNetworkManager" -destination 'platform=iOS Simulator,name=iPhone 17' -showBuildSettings | grep -m 1 "BUILT_PRODUCTS_DIR" | awk '{print $3}')
        mkdir -p ./dist_iphone
        cp -R "$BUILD_DIR/" ./dist_iphone/

    - name: Compile iPad App Payload
      run: |
        xcodebuild clean build -project MCNetworkManager.xcodeproj -scheme "MCNetworkManager" -destination 'platform=iOS Simulator,name=iPad (A16)' SUPPORTED_PLATFORMS="iphonesimulator iphoneos" SWIFT_ACTIVE_COMPILATION_CONDITIONS="iOS" -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO
        BUILD_DIR=$(xcodebuild -project MCNetworkManager.xcodeproj -scheme "MCNetworkManager" -destination 'platform=iOS Simulator,name=iPad (A16)' -showBuildSettings | grep -m 1 "BUILT_PRODUCTS_DIR" | awk '{print $3}')
        mkdir -p ./dist_ipad
        cp -R "$BUILD_DIR/" ./dist_ipad/

    - name: Upload iPhone Framework
      uses: actions/upload-artifact@v4
      with:
        name: MCNetworkManager-iPhone-App
        path: ./dist_iphone/

    - name: Upload iPad Framework
      uses: actions/upload-artifact@v4
      with:
        name: MCNetworkManager-iPad-App
        path: ./dist_ipad/
