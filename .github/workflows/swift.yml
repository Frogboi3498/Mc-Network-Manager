name: Package macOS Application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Build Framework for macOS
      run: xcodebuild clean build -project MCNetworkManager.xcodeproj -scheme "MCNetworkManager" -destination 'platform=macOS' -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO

    - name: Stage Packaging Payload
      run: |
        # 1. Fetch the exact location where Xcode compiled your binaries
        BUILD_DIR=$(xcodebuild -project MCNetworkManager.xcodeproj -scheme "MCNetworkManager" -showBuildSettings | grep -m 1 "BUILT_PRODUCTS_DIR" | awk '{print $3}')
        
        # 2. Create staging directories for our packaging scripts
        mkdir -p ./dmg_payload
        mkdir -p ./pkg_root/Applications
        mkdir -p ./dist_output
        
        # 3. Stage files for the DMG container and the PKG installer payload
        cp -R "$BUILD_DIR/" ./dmg_payload/
        cp -R "$BUILD_DIR/" ./pkg_root/Applications/

    - name: Build .dmg Installer
      run: |
        # Create a compressed read-only production DMG package container
        hdiutil create -volname "MCNetworkManager-Installer" \
                       -srcfolder ./dmg_payload \
                       -ov -format UDZO \
                       ./dist_output/MCNetworkManager.dmg

    - name: Build .pkg Installer
      run: |
        # Create a flat component package that installs directly into the /Applications system folder
        pkgbuild --root ./pkg_root \
                 --identifier "com.mcnetworkmanager.app" \
                 --version "1.0.0" \
                 --install-location / \
                 ./dist_output/MCNetworkManager.pkg

    - name: Upload Packaged Installers
      uses: actions/upload-artifact@v4
      with:
        name: MCNetworkManager-Installers
        path: ./dist_output/
        if-no-files-found: error
